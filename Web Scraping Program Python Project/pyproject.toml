[project]
name = "github-profile-explorer"
version = "0.2.0"
description = "A modern web application to explore GitHub user profiles and repositories"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.13.4",
    "pandas>=2.2.3",
    "requests>=2.32.3",
    "streamlit>=1.44.1",
    "plotly>=5.18.0",
    "typing-extensions>=4.9.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/github-profile-explorer"
Issues = "https://github.com/yourusername/github-profile-explorer/issues"
